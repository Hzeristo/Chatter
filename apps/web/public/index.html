<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111318" />
    <title>MAS Chat</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
  </head>
  <body>
    <div class="shell"><div class="app-frame">
      <aside class="sidebar">
        <div class="sidebar-header"><div class="sidebar-brand">MAS Chat</div><button id="new-session" class="button primary sidebar-new-session" type="button">新会话</button></div>
        <div class="session-history"><div class="sidebar-section-label">历史会话</div><div id="session-list" class="session-list" role="listbox" aria-label="历史会话"></div></div>
        <details class="activity" open><summary><span>运行状态</span><span id="status">idle</span></summary><div id="activity-log" class="activity-log"></div></details>
      </aside>
      <div class="main-column">
        <main class="conversation-wrap"><div id="messages" class="messages" aria-live="polite"><section id="empty-state" class="empty-state"><h2>从一个想法开始</h2><p>这里保留本地会话和 Responses 原生事件；输入一句话即可开始。</p></section></div>
          <form id="composer" class="composer">
            <div class="composer-row">
              <div class="composer-context"><button id="cancel-fork" class="message-action" type="button" hidden>取消分支</button></div>
              <div class="composer-editor"><div id="prompt" class="markdown-editor-host"></div></div>
              <div class="composer-actions">
                <button id="stop" class="button primary icon-button" type="button" aria-label="停止生成" title="停止生成" hidden>
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><rect x="6" y="6" width="12" height="12" rx="1.5" /></svg>
                </button>
                <button id="send" class="button primary icon-button" type="submit" aria-label="发送消息" title="发送消息">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 19V5m-7 7 7-7 7 7" /></svg>
                </button>
              </div>
            </div>
          </form>
        </main>
      </div>
    </div></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
