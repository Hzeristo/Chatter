<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111318" />
    <title>MAS Chat</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">LOCAL RESPONSES CLIENT</p>
          <h1>MAS Chat</h1>
        </div>
        <div class="topbar-actions">
          <span id="config-badge" class="badge">connecting</span>
          <select id="session-select" class="session-select" aria-label="选择已有会话">
            <option value="">选择已有会话</option>
          </select>
          <button id="new-session" class="button secondary" type="button">新会话</button>
        </div>
      </header>

      <main class="conversation-wrap">
        <div id="messages" class="messages" aria-live="polite">
          <section id="empty-state" class="empty-state">
            <h2>从一个想法开始</h2>
            <p>这里保留本地会话和 Responses 原生事件；输入一句话即可开始。</p>
          </section>
        </div>

        <details class="activity" open>
          <summary><span>运行状态</span><span id="status">idle</span></summary>
          <div id="activity-log" class="activity-log"></div>
        </details>

        <form id="composer" class="composer">
          <textarea id="prompt" rows="3" placeholder="输入消息……" autocomplete="off"></textarea>
          <div class="composer-footer">
            <span id="session-label" class="muted">准备会话中</span>
            <button id="send" class="button primary" type="submit">发送</button>
          </div>
        </form>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
